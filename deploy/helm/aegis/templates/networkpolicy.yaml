{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zero-public-egress
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: aegis-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aegis-platform
  egress:
    # Allow internal Kubernetes CoreDNS resolution only
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector: {}
    # Allow pod-to-pod and PrivateLink VPC CIDR traffic ONLY (0.0.0.0/0 dropped)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aegis-platform
      {{- range .Values.networkPolicy.allowedInternalCidrs }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
{{- end }}
