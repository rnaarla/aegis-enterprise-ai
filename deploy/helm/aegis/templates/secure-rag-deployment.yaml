apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-secure-rag
  labels:
    app.kubernetes.io/name: secure-rag-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aegis-platform
spec:
  replicas: {{ .Values.secureRag.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-rag-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-rag-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aegis-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secure-rag
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.secureRag.image.repository }}@{{ .Values.secureRag.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.secureRag.port }}
          env:
            - name: AEGIS_BROKER_JWKS_URL
              value: "http://{{ .Release.Name }}-sso-broker:{{ .Values.ssoBroker.port }}/.well-known/jwks.json"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TIKTOKEN_CACHE_DIR
              value: "/opt/aegis/offline-cache"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.secureRag.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-secure-rag
  labels:
    app.kubernetes.io/name: secure-rag-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secure-rag-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.secureRag.port }}
      targetPort: http
