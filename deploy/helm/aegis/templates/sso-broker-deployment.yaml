apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sso-broker
  labels:
    app.kubernetes.io/name: sso-delegation-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aegis-platform
spec:
  replicas: {{ .Values.ssoBroker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sso-delegation-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso-delegation-broker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aegis-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sso-broker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.ssoBroker.image.repository }}@{{ .Values.ssoBroker.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.ssoBroker.port }}
          env:
            - name: AEGIS_OIDC_ISSUER
              value: {{ .Values.ssoBroker.oidcIssuerUrl | quote }}
            - name: AEGIS_MAX_TTL_SECONDS
              value: {{ .Values.ssoBroker.maxTokenTtlSeconds | quote }}
            - name: HF_HUB_OFFLINE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ssoBroker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sso-broker
  labels:
    app.kubernetes.io/name: sso-delegation-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sso-delegation-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.ssoBroker.port }}
      targetPort: http
