[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-enterprise-ai"
version = "0.1.0"
description = "Zero-Trust Enterprise AI Control Plane, Runtime & Fortune 500 Solution Accelerator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "anyio>=4.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=44.0.0",
    "PyJWT>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "numpy>=2.0.0",
    "pypdf>=5.0.0",
    "temporalio>=1.9.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "PyYAML>=6.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["packages", "services", "."]
include = [
    "aegis_core*",
    "sso_delegation_broker*",
    "legacy_ingestor*",
    "secure_rag_engine*",
    "mcp_erp_bridge*",
    "pii_unmasking_proxy*",
    "temporal_approval_gate*",
    "edge_triage_router*",
    "finops_telemetry*",
    "shadow_replay_harness*",
    "arch_scoper*",
    "admin_control_plane*",
    "airgap_verifier*",
    "enterprise_twin*",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = ["packages", "services", "."]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["packages", "services", "enterprise_twin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S603", "S607"]
"enterprise_twin/**/*.py" = ["S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["packages", "services", "."]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Fast isolated unit tests with zero external daemon or process dependencies",
    "integration: Multi-component HTTP ASGI, PostgreSQL 18 RLS, Temporal SDK, and OCR integration tests",
    "system: Full end-to-end 12-module enterprise architecture and CISO PoV system workflows",
]
